[FRAMERATE]

; Maximum frame rate. The value must be an integer from 10 to 1000.
target_framerate = 170

; Remove the game's forced 60 Hz value used by fullscreen mode.
; 1 = enabled, 0 = disabled
unlock_refresh_rate = 1

; Synchronize exclusive-fullscreen presentation to the selected display refresh rate.
; 1 = enabled, 0 = disabled
fullscreen_vsync = 0

; Requested exclusive-fullscreen display refresh rate. 0 uses target_framerate.
; This is not guaranteed to be exact: DXGI selects the closest mode advertised for the current
; resolution and pixel format. For example, if only 120 and 240 Hz are available, 165 selects
; 120 Hz. UnlockTheFps.log records the mode that was actually selected.
; A non-zero value must be an integer from 10 to 1000.
fullscreen_refresh_rate = 0
