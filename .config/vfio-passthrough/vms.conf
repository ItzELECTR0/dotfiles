# ~/.config/vfio-passthrough/vms.conf
#
# Which domains the single-GPU passthrough hooks act on. Yours, in your home
# directory: adding a VM never needs root and never needs the hooks reinstalled.
#
# The hooks PARSE this file, they never source it. Nothing in here reaches a
# shell as code - which is the whole reason it can live somewhere you can write
# while the hooks themselves run as root under libvirtd. Shell-syntax overrides
# belong in /etc/libvirt/hooks/kvm.conf, which is root-owned and sourced.
#
# Syntax: one domain per line, '#' starts a comment. An explicit 'vm ' prefix
# means the same thing as a bare name. '*' matches every domain on the host.
#
# Domains listed here still need <hostdev> entries for the GPU in their XML;
# the hooks read the functions to hand over out of the domain definition.

spark
shadow
