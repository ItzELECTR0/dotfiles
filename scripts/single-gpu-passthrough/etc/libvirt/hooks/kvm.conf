# /etc/libvirt/hooks/kvm.conf
#
# Optional overrides for the single-GPU passthrough hooks. Everything in here is
# auto-detected at runtime, so an empty file is the expected state. Uncomment a
# line only when detection gets it wrong.

# Display manager service name. Detected from
# /etc/systemd/system/display-manager.service under systemd, otherwise by
# probing known names against the running init.
#VFIO_DM=sddm

# Force the init system instead of detecting it.
# One of: systemd dinit openrc runit s6
#VFIO_INIT_OVERRIDE=systemd

# Where hook state and logs go.
#VFIO_STATE_DIR=/run/libvirt/vfio-hook
#VFIO_LOG=/var/log/libvirt/vfio-hook.log

# Fallback PCI functions, used only when the hook is run by hand with no domain
# XML on stdin. Normal libvirt-driven runs read these from the domain
# definition, so keeping them here is not required and risks going stale if the
# card ever moves slots.
#VIRSH_GPU_VIDEO=pci_0000_01_00_0
#VIRSH_GPU_AUDIO=pci_0000_01_00_1
#VIRSH_GPU_USB=pci_0000_01_00_2
#VIRSH_GPU_SERIAL=pci_0000_01_00_3
